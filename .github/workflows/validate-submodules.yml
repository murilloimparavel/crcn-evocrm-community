name: Validate submodules

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check exact module paths, repositories, and gitlinks
        run: bash .github/scripts/validate-submodules.sh
