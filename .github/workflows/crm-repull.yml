name: CRM selective repull
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full CRM commit SHA associated with latest
        required: true
        type: string
      image_digest:
        description: Approved registry manifest digest (sha256 plus 64 hex characters)
        required: true
        type: string
      confirm_production:
        description: Type deploy to confirm CRM and Sidekiq repull
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: evocrm-main-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit request and enabled gate
        env:
          REQUESTED_REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm_production }}
          ENABLED: ${{ vars.CRM_REPULL_ENABLED }}
        run: |
          set -euo pipefail
          test "$REQUESTED_REF" = refs/heads/main
          test "$CONFIRM" = deploy
          test "$ENABLED" = true
  repull:
    needs: preflight
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Validate request and invoke restricted host executor
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_EXECUTOR_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_EXECUTOR_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_EXECUTOR_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_EXECUTOR_PORT }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          umask 077
          mkdir -p "$RUNNER_TEMP/evocrm-ssh"
          trap 'rm -rf "$RUNNER_TEMP/evocrm-ssh"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/evocrm-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/evocrm-ssh/known_hosts"
          python3 -c 'import json,os; print(json.dumps({"schema_version":1,"source_sha":os.environ["SOURCE_SHA"],"expected_digest":os.environ["IMAGE_DIGEST"]}))' > "$RUNNER_TEMP/evocrm-ssh/request.json"
          ssh -T -p "${DEPLOY_PORT:-22}" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/evocrm-ssh/known_hosts" -i "$RUNNER_TEMP/evocrm-ssh/key" "evocrm-deploy@$DEPLOY_HOST" crm-repull < "$RUNNER_TEMP/evocrm-ssh/request.json"
